[project]
name = "shortpipeline"
version = "0.2.0"
description = "Pipeline automático de YouTube Shorts com painel web"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "edge-tts>=7.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "faster-whisper>=1.2.1",
    "opencv-python-headless>=5.1.0.95",
    "yt-dlp>=2026.10.26",
    "python-multipart>=0.0.34",
]

[project.scripts]
shortpipeline = "shortpipeline.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["motion-canvas"]

[tool.ruff.lint]
# só erros de verdade (nomes indefinidos, imports sobrando etc.); o estilo fica livre
select = ["F"]
