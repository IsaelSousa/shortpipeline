[project]
name = "shortpipeline"
version = "0.1.0"
description = "Pipeline automático de YouTube Shorts com painel web"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "edge-tts>=7.0",
    "httpx>=0.27",
    "feedparser>=6.0",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "faster-whisper>=1.2.1",
    "opencv-python-headless>=5.1.0.95",
    "yt-dlp>=2026.10.26",
    "python-multipart>=0.0.34",
]

[project.scripts]
shortpipeline = "shortpipeline.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
