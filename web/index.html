<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShortPipeline</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="preload" href="/static/fonts/Inter.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/static/style.css">
  <script>
    try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#painel"><img src="/static/icon.svg" alt=""><div>ShortPipeline<small>Estúdio de Shorts</small></div></a>
      <nav class="primary-nav" aria-label="Navegação principal">
        <a class="nav-item" href="#painel" data-nav="painel"><svg class="i"><use href="#i-workflow"/></svg>Pipeline<span class="count" id="navCount"></span></a>
        <a class="nav-item" href="#analytics" data-nav="analytics"><svg class="i"><use href="#i-chart"/></svg>Analytics</a>
        <a class="nav-item" href="#canais" data-nav="canais"><svg class="i"><use href="#i-tv"/></svg>Canais</a>
        <a class="nav-item" href="#provedores" data-nav="provedores"><svg class="i"><use href="#i-cpu"/></svg>Provedores</a>
      </nav>
      <div class="nav-label nav-chan">Canais</div>
      <div id="navChannels" class="nav-chan"></div>
      <div class="sidebar-foot">
        <div class="worker-card" id="worker"></div>
        <button class="btn ghost sm" id="themeBtn" aria-label="Alternar tema" style="justify-content:flex-start"><svg class="i sm"><use href="#i-moon"/></svg><span>Alternar tema</span></button>
      </div>
    </aside>
    <main class="main"><div class="page" id="app"></div></main>
  </div>
  <div id="toast"></div>

  <dialog id="newDialog">
    <form method="dialog" id="newForm">
      <div class="card-head"><h3 class="grow" style="font-size:15px">Criar</h3>
        <button class="btn ghost icon" value="cancel" formnovalidate aria-label="Fechar"><svg class="i"><use href="#i-x"/></svg></button></div>
      <div class="card-body">
        <div class="segmented" id="nKind" style="align-self:flex-start">
          <button type="button" data-k="short"><svg class="i sm"><use href="#i-plus"/></svg>Short</button>
          <button type="button" data-k="long"><svg class="i sm"><use href="#i-film"/></svg>Vídeo longo</button>
          <button type="button" data-k="animado"><svg class="i sm"><use href="#i-wand"/></svg>Animado</button>
          <button type="button" data-k="cortes"><svg class="i sm"><use href="#i-scissors"/></svg>Cortes</button>
        </div>
        <label class="field"><span>Canal</span><select id="nChan"></select></label>

        <label class="field" data-for="short long animado">
          <span style="display:flex;align-items:center;justify-content:space-between">
            <span>Pauta</span>
            <button type="button" class="btn xs ghost" id="btnOpenTrends" style="font-weight:normal;padding:2px 8px;font-size:11px">🔥 Pautas em alta</button>
          </span>
          <textarea id="nTopic" class="prose" placeholder="Opcional. Deixe vazio para a IA ou o RSS escolherem."></textarea>
        </label>
        <div id="trendsDrawer" hidden class="ai-chips" style="margin-top:-6px;margin-bottom:12px;max-height:120px;overflow-y:auto;background:var(--surface-2);padding:8px;border-radius:var(--radius-sm);border:1px solid var(--border)"></div>
        <div class="row" data-for="short long animado" style="align-items:flex-end">
          <label class="field" style="max-width:140px"><span>Quantidade</span><input id="nCount" type="number" min="1" max="20" value="1"></label>
          <label class="field" data-for="long" style="max-width:220px"><span>Duração (min)</span><input id="nMinutes" type="number" min="1" max="60" step="0.5"></label>
        </div>

        <label class="field" data-for="cortes"><span>Link do vídeo</span><input id="nUrl" placeholder="https://youtube.com/watch?v=…">
          <span class="hint">YouTube e outros sites suportados pelo yt-dlp. Use só vídeos seus ou com permissão.</span></label>
        <div class="field" data-for="cortes"><span>Ou envie um arquivo</span>
          <label class="file-drop"><input id="nFile" type="file" accept="video/*"><svg class="i"><use href="#i-upload"/></svg><span id="nFileInfo"></span><span class="faint small">Escolher vídeo…</span></label>
          <div class="meter" id="nProgress" hidden><div style="width:0"></div></div></div>
        <div class="row" data-for="cortes">
          <label class="field"><span>Nº de cortes</span><input id="nClipCount" type="number" min="1" max="20"></label>
          <label class="field"><span>Mín. (s)</span><input id="nClipMin" type="number" min="5" max="170"></label>
          <label class="field"><span>Máx. (s)</span><input id="nClipMax" type="number" min="10" max="180"></label>
        </div>
        <label class="field" data-for="cortes"><span>Instruções para a IA</span><textarea id="nInstr" class="prose" style="min-height:56px" placeholder="Opcional. Ex.: foque nas partes engraçadas, evite falar de patrocinador."></textarea></label>
      </div>
      <div class="foot"><button class="btn" value="cancel" formnovalidate>Cancelar</button>
        <button class="btn primary" id="nGo" value="ok"><svg class="i"><use href="#i-check"/></svg><span id="nGoLabel">Adicionar à fila</span></button></div>
    </form>
  </dialog>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-workflow" viewBox="0 0 24 24"><rect width="8" height="8" x="3" y="3" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect width="8" height="8" x="13" y="13" rx="2"/></symbol>
      <symbol id="i-tv" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2"/><polyline points="17 2 12 7 7 2"/></symbol>
      <symbol id="i-cpu" viewBox="0 0 24 24"><rect width="16" height="16" x="4" y="4" rx="2"/><rect width="6" height="6" x="9" y="9" rx="1"/><path d="M15 2v2M15 20v2M2 15h2M2 9h2M20 15h2M20 9h2M9 2v2M9 20v2"/></symbol>

</html>
